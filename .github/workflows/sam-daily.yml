name: SAM daily search

on:
  schedule:
    # ≈ 04:00 EST / 05:00 EDT
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Posted look-back window (days)"
        required: false
        default: "15"

concurrency:
  group: sam-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SAM search
        run: |
          set -euo pipefail
          DAYS="${{ github.event.inputs.days || '15' }}"
          echo "Running frontend-only search, days=$DAYS"
          # Moderate CI pacing; frontend only (no SAM API key / quota)
          python scripts/sam_search.py \
            --days "$DAYS" \
            --history-days 15 \
            --source frontend \
            --no-latest-sync \
            --max-pages 1 \
            --robot \
            --term-sleep 3 \
            --page-sleep 1 \
            --jitter 1.5

      - name: Stage public site
        run: |
          set -euo pipefail
          mkdir -p docs/v
          test -f SAM-daily-latest.html
          test -f SAM-daily-latest.xlsx
          cp SAM-daily-latest.html docs/v/index.html
          cp SAM-daily-latest.xlsx docs/v/SAM-daily-latest.xlsx
          cat > docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="robots" content="noindex,nofollow" />
            <meta http-equiv="refresh" content="0; url=./v/" />
            <title>SAM</title>
          </head>
          <body>
            <p><a href="./v/">continue</a></p>
          </body>
          </html>
          HTML
          printf 'User-agent: *\nDisallow: /\n' > docs/robots.txt
          if ! grep -q 'noindex' docs/v/index.html; then
            sed -i 's#<head>#<head>\n  <meta name="robots" content="noindex,nofollow" />#' docs/v/index.html || true
          fi

      - name: Persist state + docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/api_term_rotation.json data/history.json docs/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily SAM report $(date -u +%Y-%m-%d)"
          fi
          git fetch origin main
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded (attempt $i)"
              exit 0
            fi
            echo "Rebase/push failed (attempt $i); retrying..."
            sleep 2
          done
          echo "Push failed after retries" >&2
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sam-daily-${{ github.run_id }}
          path: |
            SAM-daily-latest.html
            SAM-daily-latest.xlsx
            data/api_term_rotation.json
            data/history.json
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: search
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
